apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cycleline
spec:
  selector:
    app: cycleline-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cycleline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cycleline-frontend
  template:
    metadata:
      labels:
        app: cycleline-frontend
    spec:
      containers:
        - name: frontend
          # Built on the node and imported into containerd by scripts/k8s-deploy.sh.
          image: cycleline-frontend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            # Server-side only: Next.js calls the API inside the cluster.
            - name: BACKEND_URL
              value: http://backend:8080/api
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cycleline-private
                  key: AUTH_SECRET
            - name: AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: cycleline-private
                  key: AUTH_URL
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
