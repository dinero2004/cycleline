apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cycleline
spec:
  selector:
    app: cycleline-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cycleline
spec:
  # One replica: the auth rate limiter uses the file cache inside the pod.
  replicas: 1
  selector:
    matchLabels:
      app: cycleline-backend
  template:
    metadata:
      labels:
        app: cycleline-backend
    spec:
      containers:
        - name: backend
          # Built on the node and imported into containerd by scripts/k8s-deploy.sh.
          image: cycleline-backend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cycleline-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: cycleline-private
                  key: APP_KEY
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: cycleline-private
                  key: APP_URL
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cycleline-private
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
